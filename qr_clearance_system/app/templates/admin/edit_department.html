
{% extends "base.html" %}

{% block title %}Edit Department | UniClear{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Edit Department</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Department Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ department.name }}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Department Code
                    </label>

                    <input type="text"
                           name="code"
                           class="form-control"
                           value="{{ department.code }}"
                           maxlength="20"
                           required>

                </div>

                <button type="submit" class="btn btn-primary">
                    Update Department
                </button>

                <a href="{{ url_for('main.manage_departments') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
