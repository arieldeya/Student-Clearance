{% extends "base.html" %}

{% block title %}Register Officer | UniClear{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Register Department Officer</h4>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Create an officer account and assign the officer
                to a university department.
            </p>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Officer Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        placeholder="Enter officer's full name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter officer's email"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Initial Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        minlength="8"
                        placeholder="Minimum 8 characters"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Assign Department
                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        {% for department in departments %}

                        <option value="{{ department.id }}">
                            {{ department.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Officer Account
                    </button>

                    <a
                        href="{{ url_for('main.dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
