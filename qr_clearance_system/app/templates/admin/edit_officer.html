{% extends "base.html" %}

{% block title %}Edit Officer | UniClear{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Edit Department Officer</h4>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Update the officer's personal information
                and department assignment.
            </p>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Officer Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ officer.full_name }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ officer.email }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Assigned Department
                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        {% for department in departments %}

                        <option
                            value="{{ department.id }}"
                            {% if officer.department_id == department.id %}
                                selected
                            {% endif %}
                        >

                            {{ department.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('main.dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
