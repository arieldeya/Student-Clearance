{% extends "base.html" %}{% block title %}Register | UniClear{% endblock %}
{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4">
<h1 class="h4">Student registration</h1><p class="text-muted">Create an account to manage your clearance.</p>
<form method="POST">
<div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" required></div>
<div class="mb-3"><label class="form-label">Registration number</label><input class="form-control" name="registration_number" required></div>
<div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password (at least 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<div class="mb-3"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div>
<button class="btn btn-primary w-100">Create account</button></form>
<p class="small text-center mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div></div>{% endblock %}
