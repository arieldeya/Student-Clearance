{% extends "base.html" %}{% block title %}Sign in | UniClear{% endblock %}
{% block content %}<div class="auth-card card shadow-sm mx-auto"><div class="card-body p-4">
<h1 class="h4">Sign in</h1><p class="text-muted">Access your university clearance portal.</p>
<form method="POST"><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Sign in</button></form>
<p class="small text-center mt-3 mb-0">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div>{% endblock %}
